name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install poppler (pdftotext for the PDF check)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Export site
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable)" || { echo "no chrome" >&2; exit 1; }
          KOBWEB_EXPORT_BROWSER_PATH="$CHROME" ./scripts/export.sh

      - name: Download resume PDF
        run: gh release download resume --pattern resume.pdf --dir site/.kobweb/site
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Unit tests
        run: python3 -m unittest discover -s scripts

      - name: Check site
        run: python3 scripts/check_site.py site/.kobweb/site --require-file resume.pdf --pdf site/.kobweb/site/resume.pdf

      # PRs only build and check; only main publishes.
      - if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.kobweb/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
